<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PromptMap — Run History</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
    
    <style>
      :root {
        --dark: #182033;
        --red: #d64545;
        --green: #2a9d5c;
        --line: #e6e8ee;
        --muted: #6b7280;
        --shadow: 0 14px 40px rgba(24, 32, 51, 0.08);
      }
      body {
        background:
          radial-gradient(circle at top left, rgba(214, 69, 69, 0.08), transparent 24%),
          linear-gradient(180deg, #f6f7fb 0%, #eef1f6 100%);
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .navbar {
        background: var(--dark) !important;
        border-bottom: 1px solid rgba(255,255,255,.08);
        box-shadow: 0 10px 28px rgba(24, 32, 51, .18);
      }
      .navbar-brand {
        color: #fff !important;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .navbar-brand span {
        color: var(--red);
      }
      .nav-a {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.85rem;
        text-decoration: none;
      }
      .nav-a:hover {
        color: #fff;
      }
      .nav-a.active {
        color: #fff;
        font-weight: 600;
      }

      .hero-strip {
        background: linear-gradient(135deg, rgba(24,32,51,.98), rgba(37,48,74,.94));
        color: #fff;
        border-radius: 20px;
        padding: 22px 24px;
        box-shadow: var(--shadow);
        margin: 16px 0 18px;
      }
      .card-run {
        background: rgba(255,255,255,.94);
        border-radius: 18px;
        border: 1px solid rgba(255,255,255,.7);
        box-shadow: var(--shadow);
        transition: transform 0.15s, box-shadow 0.15s;
        margin-bottom: 16px;
        position: relative;
        overflow: hidden;
      }
      .card-run:hover {
        transform: translateY(-3px);
        box-shadow: 0 18px 36px rgba(24, 32, 51, 0.12);
      }
      .card-run .side-bar {
        width: 6px;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
      }

      .rate-text {
        font-size: 1.8rem;
        font-weight: 700;
        line-height: 1;
      }
      .label-small {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted);
        margin-top: 4px;
      }

      .btn-delete {
        position: absolute;
        top: 10px;
        right: 10px;
        color: #ccc;
        border: none;
        background: none;
        font-size: 0.9rem;
      }
      .btn-delete:hover {
        color: var(--red);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark mb-0">
      <div class="container-fluid px-4">
        <span class="navbar-brand"
          ><i class="bi bi-shield-shaded me-2"></i>Prompt<span>Map</span></span
        >
        <div class="d-flex gap-3 align-items-center">
          <a
            href="/"
            style="
              color: rgba(255, 255, 255, 0.7);
              font-size: 0.85rem;
              text-decoration: none;
            "
            ><i class="bi bi-play-fill me-1"></i>Run Tests</a
          >
          <a
            href="/history"
            style="
              color: #fff;
              font-size: 0.85rem;
              text-decoration: none;
              font-weight: 600;
            "
            ><i class="bi bi-clock-history me-1"></i>History</a
          >
          <a
            href="/compare"
            style="
              color: rgba(255, 255, 255, 0.7);
              font-size: 0.85rem;
              text-decoration: none;
            "
            ><i class="bi bi-bar-chart-line me-1"></i>Compare</a
          >
        </div>
      </div>
    </nav>

    <div class="container px-4">
      <div class="hero-strip">
        <div class="small text-uppercase fw-semibold mb-2" style="letter-spacing:1.1px;color:rgba(255,255,255,.68)">Run Archive</div>
        <h4 class="fw-bold mb-1">Review saved actor runs and judged results.</h4>
        <p class="mb-0" style="color:rgba(255,255,255,.72)">Pending runs stay available for later judging, and completed runs remain ready for detail review or comparison.</p>
      </div>
      <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
          <h4 class="fw-bold mb-0">Run History</h4>
          <p class="text-muted small mb-0">
            Review previously stored security test results
          </p>
        </div>
        <div id="run-count" class="badge bg-dark px-3 py-2">0 Runs</div>
      </div>

      <div id="history-list" class="row">
        <div class="col-12 text-center py-5 text-muted" id="loading">
          <div class="spinner-border text-secondary mb-2"></div>
          <br />Loading history…
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script>
      async function load() {
        try {
          const r = await fetch("/api/runs");
          const runs = await r.json();
          render(runs);
        } catch (e) {
          document.getElementById(
            "history-list"
          ).innerHTML = `<div class="alert alert-danger">Error loading history: ${e.message}</div>`;
        }
      }

      function render(runs) {
        const list = document.getElementById("history-list");
        const countEl = document.getElementById("run-count");

        if (!runs || runs.length === 0) {
          list.innerHTML =
            '<div class="col-12 text-center py-5"><i class="bi bi-folder2-open fs-1 text-muted d-block mb-2"></i>No runs found. Start a new test to see them here.</div>';
          countEl.textContent = "0 Runs";
          return;
        }

        countEl.textContent = `${runs.length} Run${
          runs.length === 1 ? "" : "s"
        }`;
        runs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        list.innerHTML = runs
          .map((r) => {
            const pct = r.pass_rate || 0;
            const isJudged = r.status === "judged";
            const canResume = r.status === "interrupted" || r.status === "running";
            const color = !isJudged
              ? (canResume ? "#e76f51" : "#457b9d")
              : (pct >= 70 ? "#2a9d5c" : pct >= 40 ? "#f4a261" : "#e63946");
            const ts = new Date(r.timestamp).toLocaleString();

            return `
      <div class="col-md-6 col-xl-4" id="run-${r.job_id}">
        <div class="card-run p-3">
          <div class="side-bar" style="background:${color}"></div>

          <button class="btn-delete" onclick="deleteRun('${
            r.job_id
          }', event)" title="Delete run">
            <i class="bi bi-trash"></i>
          </button>

          <a href="/run/${r.job_id}" class="text-decoration-none text-dark">
            <div class="d-flex justify-content-between align-items-start mb-2 pe-4" style="padding-left:10px">
              <div>
                <div class="fw-bold text-truncate" style="max-width:200px">${esc(
                  r.model
                )}</div>
                <div class="text-muted" style="font-size:.7rem">${esc(
                  r.model_type
                )} · ${ts}</div>
              </div>
            </div>

            <div class="row align-items-center g-2 mt-2" style="padding-left:10px">
              <div class="col-4 border-end">
                <div class="rate-text" style="color:${color}">${isJudged ? `${pct}%` : (r.pending_tests ?? r.total)}</div>
                <div class="label-small">${isJudged ? "Pass Rate" : "Pending Judge"}</div>
              </div>
              <div class="col-8 ps-3">
                <div class="d-flex gap-3">
                  <div>
                    <div class="fw-bold text-success">${r.passed}</div>
                    <div class="label-small">Passed</div>
                  </div>
                  <div>
                    <div class="fw-bold text-danger">${r.failed}</div>
                    <div class="label-small">Failed</div>
                  </div>
                  <div>
                    <div class="fw-bold">${r.total}</div>
                    <div class="label-small">Total</div>
                  </div>
                </div>
              </div>
            </div>

            <div class="mt-3 pt-2 border-top d-flex justify-content-between align-items-center gap-2" style="padding-left:10px">
              <span class="badge ${isJudged ? "bg-light text-dark border" : (canResume ? "bg-danger" : "bg-primary")} small">${isJudged ? `ID: ${r.job_id}` : (canResume ? "Interrupted" : "Responses Saved")}</span>
              <span class="text-primary small fw-semibold">View Details <i class="bi bi-arrow-right"></i></span>
            </div>
          </a>
          ${canResume ? `
            <button class="btn btn-sm btn-outline-danger mt-2 ms-2" onclick="resumeRun('${r.job_id}', event)">
              <i class="bi bi-play-circle me-1"></i>Resume
            </button>
          ` : ""}
        </div>
      </div>
    `;
          })
          .join("");
      }

      async function deleteRun(jobId, event) {
        event.preventDefault();
        event.stopPropagation();
        if (!confirm("Delete this run forever?")) return;
        try {
          const r = await fetch(`/api/runs/delete/${jobId}`, {
            method: "DELETE",
          });
          if (r.ok) {
            document.getElementById(`run-${jobId}`).remove();
            const countEl = document.getElementById("run-count");
            const currentCount = parseInt(countEl.textContent);
            countEl.textContent = `${currentCount - 1} Run${
              currentCount - 1 === 1 ? "" : "s"
            }`;
          }
        } catch (e) {
          alert("Error deleting run");
        }
      }

      async function resumeRun(jobId, event) {
        event.preventDefault();
        event.stopPropagation();
        try {
          const r = await fetch(`/api/runs/resume/${jobId}`, { method: "POST" });
          const data = await r.json();
          if (!r.ok) {
            alert(data.error || "Could not resume run.");
            return;
          }
          localStorage.setItem("promptmap.activeJob", JSON.stringify({ job_id: data.job_id, run_id: data.run_id, mode: "resume" }));
          localStorage.setItem("promptmap.latestRunId", data.run_id);
          window.location.href = `/run/${data.run_id}`;
        } catch (e) {
          alert("Error resuming run: " + e.message);
        }
      }

      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      load();
    </script>
  </body>
</html>
